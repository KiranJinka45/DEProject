version: 2

models:
  - name: dim_date
    description: "Conformed calendar date dimension table for temporal rollups and slicing."
    columns:
      - name: date_sk
        description: "Primary surrogate key in integer format YYYYMMDD"
        tests:
          - unique
          - not_null
      - name: calendar_date
        tests:
          - unique
          - not_null

  - name: dim_customer
    description: "SCD Type 2 Customer dimension tracking historical changes and customer lifetime tiering."
    columns:
      - name: customer_sk
        description: "Surrogate key generated from customer_id and valid_from"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Natural business identifier for customer"
        tests:
          - not_null
      - name: email
        tests:
          - not_null
      - name: customer_ltv_tier
        description: "Dynamic segment based on lifetime spend: Bronze, Silver, Gold, VIP / Platinum"
        tests:
          - accepted_values:
              values: ['Bronze', 'Silver', 'Gold', 'VIP / Platinum']

  - name: dim_product
    description: "Product catalog dimension with SKU, categories, and unit margins."
    columns:
      - name: product_sk
        description: "Surrogate key for product"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "Natural product identifier"
        tests:
          - not_null
      - name: sku
        tests:
          - not_null
      - name: margin_tier
        tests:
          - accepted_values:
              values: ['High Margin', 'Medium Margin', 'Low Margin']

  - name: dim_marketing_channel
    description: "Marketing channel dimension aggregating performance and CAC metrics."
    columns:
      - name: channel_sk
        description: "Surrogate key for channel"
        tests:
          - unique
          - not_null
      - name: channel_name
        tests:
          - not_null
          - unique

  - name: fact_orders
    description: "Order-level grain fact table containing net revenue, items summary, and sequence flags."
    columns:
      - name: order_sk
        description: "Surrogate key for order"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Natural order identifier"
        tests:
          - not_null
      - name: order_date_sk
        description: "Foreign key reference to dim_date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: customer_id
        description: "Customer natural key"
        tests:
          - not_null
      - name: total_amount_usd
        description: "Order total amount normalized into USD"
        tests:
          - not_null
      - name: order_status
        description: "Order fulfillment status"
        tests:
          - accepted_values:
              values: ['pending', 'processing', 'completed', 'shipped', 'delivered', 'cancelled', 'refunded']

  - name: fact_order_items
    description: "Line-item grain fact table for item sales, discounts, and product profit margins."
    columns:
      - name: order_item_sk
        description: "Surrogate key for line item"
        tests:
          - unique
          - not_null
      - name: order_item_id
        description: "Natural line item identifier"
        tests:
          - not_null
      - name: order_sk
        description: "Foreign key to fact_orders"
        tests:
          - not_null
          - relationships:
              to: ref('fact_orders')
              field: order_sk
      - name: product_sk
        description: "Foreign key to dim_product"
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_sk
      - name: order_date_sk
        description: "Foreign key to dim_date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: quantity
        description: "Units ordered"
        tests:
          - not_null
      - name: net_subtotal_usd
        description: "Calculated net revenue after discount in USD"
        tests:
          - not_null
