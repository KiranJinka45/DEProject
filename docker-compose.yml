version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: ecommerce-airflow:2.9.3
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow_secure_pass}@postgres-warehouse:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    # Warehouse connection for tasks
    WAREHOUSE_HOST: postgres-warehouse
    WAREHOUSE_PORT: 5432
    WAREHOUSE_DB: ${WAREHOUSE_DB:-ecommerce_warehouse}
    WAREHOUSE_USER: ${WAREHOUSE_USER:-dw_admin}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-dw_secure_pass}
    # Object store (MinIO)
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_key}
    AWS_ENDPOINT_URL: http://minio:9000
    AWS_DEFAULT_REGION: us-east-1
    # Python & dbt Paths
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_PROJECT_DIR: /opt/airflow/dbt
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./tests:/opt/airflow/tests
    - airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-warehouse:
      condition: service_healthy

services:
  # ============================================================================
  # 1. Analytical Staging & Airflow Metadata Relational Storage
  # ============================================================================
  postgres-warehouse:
    image: postgres:16-alpine
    container_name: postgres-warehouse
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-warehouse.sql:/docker-entrypoint-initdb.d/init-warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data-platform-net

  # ============================================================================
  # 2. Local Object Store (MinIO - S3 Compatible Storage)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: minio-lakehouse
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_key}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - data-platform-net

  minio-init-buckets:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: minio-init-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_secure_key};
      /usr/bin/mc mb --ignore-existing local/lakehouse-raw;
      /usr/bin/mc mb --ignore-existing local/lakehouse-bronze;
      /usr/bin/mc mb --ignore-existing local/lakehouse-silver;
      /usr/bin/mc mb --ignore-existing local/lakehouse-gold;
      exit 0;
      "
    networks:
      - data-platform-net

  # ============================================================================
  # 3. Apache Airflow Orchestration Suite
  # ============================================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --firstname Data \
          --lastname Lead \
          --role Admin \
          --email admin@ecommerce-platform.internal \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" || true
    networks:
      - data-platform-net

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-platform-net

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-platform-net

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-platform-net

volumes:
  postgres_data:
    name: ecommerce_postgres_data
  minio_data:
    name: ecommerce_minio_data
  airflow_logs:
    name: ecommerce_airflow_logs

networks:
  data-platform-net:
    name: ecommerce_platform_network
    driver: bridge
